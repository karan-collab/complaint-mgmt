server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # There is no build step, so asset filenames never change between releases
    # (app.js is always app.js). Without this, a browser can keep serving a
    # cached copy after a deploy and run yesterday's JavaScript against today's
    # API. "no-cache" does not mean "don't store" - it means "revalidate before
    # reusing", and the ETag/Last-Modified headers make that cheap: unchanged
    # files come back as a 304 with no body.
    #
    # If a build step with content-hashed filenames is ever added, switch the
    # hashed assets to a long max-age and keep this only for index.html.
    add_header Cache-Control "no-cache" always;

    # Static frontend (hash-router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to Spring Boot (Compose service name: api)
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator health (optional, for ops)
    location /actuator/ {
        proxy_pass http://api:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
