<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <title>SocietyCare - Resident</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d9488'/%3E%3Cpath fill='%23fff' d='M32 14 16 26v22h10V36h12v12h10V26z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a href="#/dashboard" class="brand" aria-label="SocietyCare home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11 12 4l9 7" />
              <path d="M5 10v10h14V10" />
              <path d="M10 20v-6h4v6" />
            </svg>
          </span>
          <span class="brand-text">SocietyCare</span>
        </a>
        <div class="topbar-end">
          <div class="topbar-user" id="topbarUser" hidden>
            <p class="topbar-name" id="topbarName"></p>
            <p class="topbar-flat" id="topbarFlat"></p>
          </div>
          <button type="button" id="changePwBtn" class="topbar-btn" hidden title="Change password" aria-label="Change password">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="10" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span class="topbar-btn-text">Change password</span>
          </button>
          <button type="button" id="logoutBtn" class="logout-btn" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="m16 17 5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            <span class="logout-text">Logout</span>
          </button>
        </div>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="scripts/config.js"></script>
    <script src="scripts/session.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/toast.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/views/role.js"></script>
    <script src="scripts/views/login.js"></script>
    <script src="scripts/views/adminLogin.js"></script>
    <script src="scripts/views/dashboard.js"></script>
    <script src="scripts/views/raise.js"></script>
    <script src="scripts/views/complaints.js"></script>
    <script src="scripts/views/adminDashboard.js"></script>
    <script src="scripts/views/adminTickets.js"></script>
    <script src="scripts/views/adminResidents.js"></script>
    <script src="scripts/views/adminProfessionals.js"></script>
    <script src="scripts/views/changePassword.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
