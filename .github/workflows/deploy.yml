name: Deploy

# Build once, then promote the SAME images through beta to production.
#
#   push to main ──► build-and-push ──► deploy-beta ──► deploy-production
#                    (tests, images)     (automatic)     (waits for approval)
#
# Nothing is rebuilt between beta and production: both stages deploy the image
# tagged with this commit's SHA. Whatever you checked on beta is bit-for-bit
# what residents get, so a dependency cannot quietly change underneath you.
#
# The approval gate is not in this file - it comes from the "production"
# GitHub Environment having required reviewers configured. See deploy/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # Nothing is built or shipped if the suite fails, so broken code cannot
      # reach a server even by accident.
      - name: Run tests
        working-directory: backend
        run: mvn -s settings.xml verify

      # Emulation, so an amd64 runner can produce arm64 layers too.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-api:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-web:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-web:latest

    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      sha: ${{ steps.meta.outputs.sha }}

  deploy-beta:
    runs-on: ubuntu-latest
    needs: build-and-push
    # secrets.* cannot be used in a job-level if (GitHub Actions restriction), so
    # this is gated on a repository *variable* instead.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: beta
      url: https://beta.complaintsmgmt.com
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/bootstrap-admin.sql,deploy/scripts/*,deploy/systemd/*
          target: /opt/societycare
          strip_components: 1

      - name: Deploy beta
        uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OWNER,SHA,POSTGRES_PASSWORD,DB_PASSWORD,JWT_SECRET,GHCR_PAT,REPO_OWNER
          script: |
            set -euo pipefail
            chmod +x /opt/societycare/scripts/*.sh
            echo "$GHCR_PAT" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin
            /opt/societycare/scripts/deploy-stack.sh beta \
              "ghcr.io/${OWNER}/societycare-api:${SHA}" \
              "ghcr.io/${OWNER}/societycare-web:${SHA}" \
              8081

  deploy-production:
    runs-on: ubuntu-latest
    # Waits for beta to succeed AND for a human to approve, because the
    # "production" environment has required reviewers configured in GitHub.
    needs: [build-and-push, deploy-beta]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://complaintsmgmt.com
    steps:
      - uses: actions/checkout@v4

      # Deliberately no build step, and no file copy: the images are the exact
      # ones beta has been running, and deploy-beta already put the current
      # compose file and scripts on the server. This job is guaranteed to run
      # after it by `needs`.
      - name: Deploy production
        uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OWNER,SHA,POSTGRES_PASSWORD,DB_PASSWORD,JWT_SECRET,GHCR_PAT,REPO_OWNER
          script: |
            set -euo pipefail
            chmod +x /opt/societycare/scripts/*.sh
            echo "$GHCR_PAT" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin
            /opt/societycare/scripts/deploy-stack.sh prod \
              "ghcr.io/${OWNER}/societycare-api:${SHA}" \
              "ghcr.io/${OWNER}/societycare-web:${SHA}" \
              8080
