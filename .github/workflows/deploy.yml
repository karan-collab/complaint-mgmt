name: Deploy

# Build once, then deploy the SAME images - optionally via beta first.
#
#   BETA_ENABLED=true:
#     push to main ──► build-and-push ──► deploy-beta ──► deploy-production
#                      (tests, images)     (automatic)     (waits for approval)
#
#   BETA_ENABLED unset (a single production environment):
#     push to main ──► build-and-push ──► deploy-production
#                      (tests, images)     (waits for approval)
#
# Nothing is ever rebuilt between stages: every deploy uses the image tagged
# with this commit's SHA, so what you checked is bit-for-bit what residents get
# and a dependency cannot quietly change underneath you.
#
# The approval gate is not in this file - it comes from the "production"
# GitHub Environment having required reviewers configured. See deploy/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # Nothing is built or shipped if the suite fails, so broken code cannot
      # reach a server even by accident.
      - name: Run tests
        working-directory: backend
        run: mvn -s settings.xml verify

      # Emulation, so an amd64 runner can produce arm64 layers too.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-api:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-web:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/societycare-web:latest

    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      sha: ${{ steps.meta.outputs.sha }}

  deploy-beta:
    runs-on: ubuntu-latest
    needs: build-and-push
    # secrets.* cannot be used in a job-level if (GitHub Actions restriction), so
    # these are gated on repository *variables*.
    #
    # Beta is opt-in: set BETA_ENABLED=true once a beta host exists. Until then
    # this job is skipped and production deploys on its own.
    if: >-
      github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
      && vars.BETA_ENABLED == 'true'
    environment:
      name: beta
      url: https://beta.complaintsmgmt.com
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/bootstrap-admin.sql,deploy/scripts/*,deploy/systemd/*
          target: /opt/societycare
          strip_components: 1

      - name: Deploy beta
        uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OWNER,SHA,POSTGRES_PASSWORD,DB_PASSWORD,JWT_SECRET,GHCR_PAT,REPO_OWNER
          script: |
            set -euo pipefail
            chmod +x /opt/societycare/scripts/*.sh
            echo "$GHCR_PAT" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin
            /opt/societycare/scripts/deploy-stack.sh beta \
              "ghcr.io/${OWNER}/societycare-api:${SHA}" \
              "ghcr.io/${OWNER}/societycare-web:${SHA}" \
              8081

  deploy-production:
    runs-on: ubuntu-latest
    # Waits for a human to approve, because the "production" environment has
    # required reviewers configured in GitHub. When beta is enabled it waits for
    # that too.
    needs: [build-and-push, deploy-beta]
    # A skipped dependency would normally skip this job as well, so the result of
    # deploy-beta is checked explicitly: it must have succeeded, or been skipped
    # because BETA_ENABLED is unset. A beta that actually FAILED still blocks
    # production, which is the whole point of having it.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
      && needs.build-and-push.result == 'success'
      && (needs.deploy-beta.result == 'success' || needs.deploy-beta.result == 'skipped')
    environment:
      name: production
      url: https://complaintsmgmt.com
    steps:
      - uses: actions/checkout@v4

      # Deliberately no build step: the images are the exact ones built once by
      # build-and-push, and - when beta is enabled - the exact ones beta has
      # been running.
      #
      # The file copy is repeated here rather than relying on deploy-beta,
      # because beta may be skipped entirely, and because production may live on
      # a different host.
      - name: Copy deploy files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/bootstrap-admin.sql,deploy/scripts/*,deploy/systemd/*
          target: /opt/societycare
          strip_components: 1

      - name: Deploy production
        uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OWNER,SHA,POSTGRES_PASSWORD,DB_PASSWORD,JWT_SECRET,GHCR_PAT,REPO_OWNER
          script: |
            set -euo pipefail
            chmod +x /opt/societycare/scripts/*.sh
            echo "$GHCR_PAT" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin
            /opt/societycare/scripts/deploy-stack.sh prod \
              "ghcr.io/${OWNER}/societycare-api:${SHA}" \
              "ghcr.io/${OWNER}/societycare-web:${SHA}" \
              8080
