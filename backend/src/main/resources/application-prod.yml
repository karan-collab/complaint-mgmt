spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.societycare: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

seed:
  enabled: false
