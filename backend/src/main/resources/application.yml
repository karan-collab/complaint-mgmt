spring:
  application:
    name: societycare-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # Do NOT add hibernate.jdbc.time_zone here. It used to be set to UTC, and it
    # shifted every timestamp the application wrote by the JVM's offset (5h30m
    # on an IST machine): "just now" came back as "5 hours ago".
    #
    # That property exists for columns declared plain TIMESTAMP, which carry no
    # zone of their own and need one supplied. Every timestamp column in this
    # schema is TIMESTAMP WITH TIME ZONE, so the offset already travels with the
    # value - converting it a second time on the way to the driver double-counts.
    # Guarded by TimestampRoundTripTest.
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

seed:
  enabled: false

security:
  jwt:
    # Base64-encoded HS256 secret (>=256 bits). Override in prod via env var.
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvbmctZGV2LW9ubHktc2VjcmV0LXJlcGxhY2UtaW4tcHJvZHVjdGlvbi1zby0yNTYtYml0LWhzMjU2LXNpZ25lZA==}
    ttl-minutes: 120
    issuer: societycare

app:
  cors:
    # Comma-separated list. In dev, allow VS Code Live Server defaults.
    # In prod, override with APP_CORS_ALLOWED_ORIGINS=https://your-domain.example
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
