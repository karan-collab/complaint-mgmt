# A SocietyCare stack on the VPS. Images are pulled from GHCR (built by the
# deploy workflow); nothing is compiled on the server.
#
# One file serves both environments. The -p flag is what keeps them apart: it
# sets the Compose project name, which prefixes the containers, the network and
# - crucially - the pgdata volume. societycare-beta and societycare-prod
# therefore have entirely separate databases.
#
#   docker compose -p societycare-prod -f docker-compose.prod.yml --env-file prod/.env up -d
#   docker compose -p societycare-beta -f docker-compose.prod.yml --env-file beta/.env up -d
#
# In practice deploy-stack.sh does this for you.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: societycare
      POSTGRES_USER: ${DB_USER:-societycare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Postgres sizes itself for a dedicated server by default. Here it shares a
    # small box with the API, so it is told to be modest: 64 MB of shared
    # buffers is plenty for a database measured in megabytes, and capping
    # connections stops a runaway client spawning backends until the machine
    # dies.
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=25
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-societycare} -d societycare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/societycare
      DB_USER: ${DB_USER:-societycare}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    ports:
      # 127.0.0.1 only: Caddy is the sole thing the internet may reach, and it
      # forwards here. Each environment needs its own host port - prod 8080,
      # beta 8081 - because two programs cannot listen on one port.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
